<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Portal sedang dirawat</title>
    <style>
      :root{color-scheme:light;background:#f7f8f8;color:#183345;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1rem;line-height:1.6}
      main{width:min(100%,42rem);background:#fff;border:1px solid #e8ebec;border-radius:12px;box-shadow:0 24px 80px rgba(24,51,69,.12);padding:clamp(1.5rem,4vw,2.5rem)}
      h1{max-width:16ch;margin:.4rem 0;font-size:clamp(2rem,8vw,3.25rem);line-height:1.1}
      p{max-width:52ch}.eyebrow{color:#0866b5;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
      svg{display:block;width:min(100%,20rem);height:auto;margin-bottom:1rem;fill:none;stroke:#0866b5;stroke-width:3;stroke-linecap:round}
      @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 320 64" role="img" aria-label="Jalur koneksi antara perangkat dan server">
        <circle cx="22" cy="32" r="8"/><path d="M30 32h260"/><circle cx="130" cy="32" r="5"/><circle cx="210" cy="32" r="5"/><circle cx="298" cy="32" r="8"/>
      </svg>
      <p class="eyebrow">Portal VPN</p>
      <h1>Portal sedang dirawat.</h1>
      <p>Halaman akun belum tersedia. Silakan periksa kembali nanti.</p>
    </main>
  </body>
</html>
